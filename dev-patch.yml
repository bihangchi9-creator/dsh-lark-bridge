# Dev overlay to smoke-test dsh-lark-bridge against a running `dsh web`.
#
# Usage (from ~/Desktop/deepseek-harness):
#   DSH_PERMISSION_MODE=danger-full-access \
#   LARK_APP_ID=cli_xxx LARK_APP_SECRET=yyy \
#   corepack pnpm dsh web --patch ~/Desktop/dsh-lark-bridge/dev-patch.yml
#
# It inserts one row: our plugin, resolved by package name (the monorepo
# symlink node_modules/dsh-lark-bridge -> the project makes Node find it).
# Feishu credentials and DeepSeek model come from environment variables (see
# src/config.ts), so nothing secret lives in this file.

- insert:
    - id: lark-bridge
      name: dsh-lark-bridge
      inject: [agents, sessions, agentPresets, agentDefaultModel]
