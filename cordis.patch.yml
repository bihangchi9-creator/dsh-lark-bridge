# The dsh-lark-bridge patch layer.
#
# A profile that lists this bundle gets one extra plugin row: the Feishu/Lark
# bridge. It requires only the core `agents` service; optional services are
# resolved with ctx.get() so their absence cannot block the whole dsh host.
#
# Config is read from environment variables by default (see src/config.ts), so
# users normally do not need to edit this file. To override inline, add a
# `config:` block under the row below.

- insert:
    - id: lark-bridge
      name: dsh-lark-bridge
      inject: [agents]
